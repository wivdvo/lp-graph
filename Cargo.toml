[workspace]
resolver = "2"
members = ["common", "tracker", "graph", "tools/stamp", "installer"]
# the installer embeds the built programs, so build.ps1 builds it in a second step
default-members = ["common", "tracker", "graph", "tools/stamp"]

[workspace.package]
version = "1.0.0"

[workspace.dependencies]
serde_json = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Time",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
